<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboSpeed Pro 2026 - اختبار سرعة الانترنت</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 450px;
            background: #161b22;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #30363d;
        }
        .icon {
            width: 80px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            color: #58a6ff;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .speed-gauge {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 8px solid #21262d;
            border-top: 8px solid #238636;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        .speed-number {
            font-size: 40px;
            font-weight: bold;
            color: #3fb950;
        }
        .speed-unit {
            font-size: 14px;
            color: #8b949e;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn:hover {
            background: #2ea043;
        }
        
        /* شاشة الاختراق الوهمية */
        #hacked-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            box-sizing: border-box;
            z-index: 9999;
            text-align: left;
            direction: ltr;
            overflow: hidden;
        }
        .red-alert {
            color: #ff0000;
            font-weight: bold;
            font-size: 20px;
            text-align: center;
            margin-top: 15px;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .prank-title {
            color: #fff;
            font-size: 22px;
            text-align: center;
            margin: 20px 0 10px 0;
            direction: rtl;
        }
        .prank-sub {
            color: #ff4d4d;
            font-size: 16px;
            text-align: center;
            direction: rtl;
            font-weight: bold;
        }
        .terminal-log {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 20px;
            height: 200px;
            overflow: hidden;
        }
        .cancel-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            direction: rtl;
        }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: قياس السرعة الوهمي -->
    <div class="container" id="main-screen">
        <img src="https://img.icons8.com/fluency/96/rocket.png" class="icon" alt="Turbo">
        <h1>TurboSpeed Pro</h1>
        <p class="subtitle">إصدار 2026 - نظام نصرو الذكي لتحسين وتطوير السرعة</p>
        
        <div class="speed-gauge">
            <span class="speed-number" id="speed-num">0</span>
            <span class="speed-unit">Mbps</span>
        </div>

        <button class="btn" id="start-btn" onclick="startTest()">ابدأ فحص وتسريع الشبكة 🚀</button>
    </div>

    <!-- الشاشة الثانية: مقلب الاختراق -->
    <div id="hacked-screen">
        <div class="red-alert">⚠️ WARNING: SYSTEM COMPROMISED ⚠️</div>
        <div class="prank-title">ياحمار طحت فل حفرة 🤣! 💀</div>
        <div class="prank-sub">إغلاق الصفحة = نشر جميع الفضائح فوراً! 🚨</div>
        
        <div class="terminal-log" id="terminal">
            <div>> Accessing system root... OK</div>
        </div>

        <button class="cancel-btn" onclick="cancelPrank()">🛑 إلغاء العملية وتدمير البيانات</button>
    </div>

    <script>
        // التعرّف على جهاز ومواصفات الضحية
        let deviceOS = "Unknown Device";
        const ua = navigator.userAgent;
        if (ua.indexOf("Android") > -1) deviceOS = "Android Device";
        else if (ua.indexOf("iPhone") > -1) deviceOS = "iPhone (iOS)";
        else if (ua.indexOf("Windows") > -1) deviceOS = "Windows PC";
        else if (ua.indexOf("Mac") > -1) deviceOS = "MacBook";

        let batteryLevel = "غير معروفة";
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                batteryLevel = Math.round(battery.level * 100) + "%";
            });
        }

        function startTest() {
            // محاولة تفعيل ملء الشاشة
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(()=>{});
            }

            document.getElementById('start-btn').innerText = "جاري الفحص والتسريع...";
            let speed = 0;
            let speedNum = document.getElementById('speed-num');

            // انيميشن زيادة السرعة
            let interval = setInterval(() => {
                speed += Math.floor(Math.random() * 45) + 15;
                speedNum.innerText = speed;
                
                if (speed >= 980) {
                    clearInterval(interval);
                    speedNum.innerText = "980";
                    setTimeout(showHackedScreen, 800);
                }
            }, 100);
        }

        function showHackedScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('hacked-screen').style.display = 'block';
            
            startTerminalLog();
        }

        function startTerminalLog() {
            const terminal = document.getElementById('terminal');
            
            const logs = [
                `> Target Device Detected: ${deviceOS}`,
                `> Target Battery Status: ${batteryLevel}`,
                "> Connecting to Nassro Private Cloud...",
                "> Extracting Photos & WhatsApp Database...",
                "> Accessing Front Camera... [CAPTURED 📸]",
                "> Uploading personal files to server (45%)...",
                "> Uploading personal files to server (89%)...",
                "> Status: ALL DATA LEAKED SUCCESSFULLY 💀"
            ];

            let index = 0;
            let logInterval = setInterval(() => {
                if (index < logs.length) {
                    let p = document.createElement('div');
                    p.innerText = logs[index];
                    terminal.appendChild(p);
                    index++;
                } else {
                    clearInterval(logInterval);
                }
            }, 1200);
        }

        function cancelPrank() {
            alert("❌ خطأ: تم تسريع نشر الفضائح بنسبة 200%! 😂💀");
        }
    </script>
</body>
</html>
