<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurboSpeed Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 90%;
            max-width: 450px;
            background: #161b22;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #30363d;
        }
        .icons-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .icons-row img {
            width: 48px;
            height: 48px;
        }
        .main-rocket {
            width: 90px;
            height: 90px;
            margin: 10px auto;
        }
        h1 {
            font-size: 26px;
            color: #58a6ff;
            margin: 10px 0;
        }
        .speed-badge {
            background: #21262d;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 18px;
            color: #3fb950;
            font-weight: bold;
            margin: 15px 0 25px 0;
            display: inline-block;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            background: #238636;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .btn:hover {
            background: #2ea043;
        }

        /* شاشة الاختراق الوهمية */
        #hacked-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 30px;
            box-sizing: border-box;
            z-index: 9999;
            text-align: left;
            direction: ltr;
            overflow: hidden;
        }
        .red-alert {
            color: #ff0000;
            font-weight: bold;
            font-size: 22px;
            text-align: center;
            margin-bottom: 15px;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        .prank-title {
            color: #fff;
            font-size: 22px;
            text-align: center;
            margin: 15px 0;
            direction: rtl;
        }
        .prank-sub {
            color: #ff4d4d;
            font-size: 16px;
            text-align: center;
            direction: rtl;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .terminal-log {
            font-size: 14px;
            line-height: 1.6;
            height: 220px;
            background: #050505;
            border: 1px solid #111;
            padding: 15px;
            border-radius: 8px;
            overflow: hidden;
        }
        .cancel-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            direction: rtl;
        }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: تصميمك الأصلي -->
    <div class="container" id="main-screen">
        <div class="icons-row">
            <img src="https://img.icons8.com/fluency/96/shield.png" alt="Shield">
            <img src="https://img.icons8.com/fluency/96/wi-fi--v1.png" alt="Wifi">
            <img src="https://img.icons8.com/fluency/96/smartphone.png" alt="Phone">
        </div>
        <img src="https://img.icons8.com/fluency/144/rocket.png" class="main-rocket" alt="Rocket">
        <h1>TurboSpeed Pro</h1>
        
        <div class="speed-badge" id="speed-display">📶 السرعة الحالية: <span id="speed-num">980</span> Mbps</div>
        
        <p>إصدار 2026 - نظام نصرو الذكي</p>

        <button class="btn" id="start-btn" onclick="startTest()">بدء الفحص والتسريع 🚀</button>
    </div>

    <!-- الشاشة الثانية: شاشة الاختراق المرعبة بالمعلومات الحقيقية -->
    <div id="hacked-screen">
        <div class="red-alert">⚠️ WARNING: SYSTEM COMPROMISED ⚠️</div>
        <div class="prank-title">يا حمار قد وقعت في كميني.. وقعت في فخ نصرو! 💀</div>
        <div class="prank-sub">إغلاق الصفحة = نشر جميع الفضائح فوراً! 🚨</div>
        
        <div class="terminal-log" id="terminal">
            <div>> Initializing Hack... OK</div>
        </div>

        <button class="cancel-btn" onclick="cancelPrank()">🛑 إلغاء العملية وتدمير البيانات</button>
    </div>

    <audio loop src="https://www.soundjay.com/buttons/beep-01a.mp3" id="beep-audio"></audio>

    <script>
        // الكشف عن معلومات جهاز الضحية الحقيقية
        let deviceOS = "Unknown Device";
        const ua = navigator.userAgent;
        if (ua.indexOf("Android") > -1) deviceOS = "Android Phone";
        else if (ua.indexOf("iPhone") > -1) deviceOS = "iPhone (iOS)";
        else if (ua.indexOf("Windows") > -1) deviceOS = "Windows PC";
        else if (ua.indexOf("Mac") > -1) deviceOS = "MacBook";

        let batteryStatus = "غير معروفة";
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                batteryStatus = Math.round(battery.level * 100) + "%";
            });
        }

        function startTest() {
            // تفعيل ملء الشاشة للخلع
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(()=>{});
            }

            document.getElementById('start-btn').innerText = "جاري فحص الاتصال...";
            let currentSpeed = 10;
            let speedNum = document.getElementById('speed-num');

            // عداد وهمي يبدأ يطلع تدريجياً
            let interval = setInterval(() => {
                currentSpeed += Math.floor(Math.random() * 60) + 20;
                speedNum.innerText = currentSpeed;

                if (currentSpeed >= 1200) {
                    clearInterval(interval);
                    speedNum.innerText = "1200";
                    setTimeout(showHackedScreen, 600);
                }
            }, 80);
        }

        function showHackedScreen() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('hacked-screen').style.display = 'block';
            
            // محاولة تشغيل الصوت إن وجد
            let audio = document.getElementById('beep-audio');
            if(audio) { audio.play().catch(()=>{}); }

            startTerminalLogs();
        }

        function startTerminalLogs() {
            const terminal = document.getElementById('terminal');
            
            const logs = [
                `> Target Device Detected: ${deviceOS}`,
                `> Target Battery Level: ${batteryStatus}`,
                "> Establishing secure tunnel to Nassro Server...",
                "> Extracting WhatsApp chats & Gallery images...",
                "> Accessing Front Camera... [TARGET CAPTURED 📸]",
                "> Uploading personal database to public cloud (54%)...",
                "> Uploading personal database to public cloud (98%).. [SUCCESS]",
                "> 💀 CRITICAL ERROR: ALL YOUR FILES ARE LEAKED NOW!"
            ];

            let index = 0;
            let logInterval = setInterval(() => {
                if (index < logs.length) {
                    let div = document.createElement('div');
                    div.innerText = logs[index];
                    terminal.appendChild(div);
                    terminal.scrollTop = terminal.scrollHeight; // النزول تلقائياً مع الأسطر
                    index++;
                } else {
                    clearInterval(logInterval);
                }
            }, 1000);
        }

        function cancelPrank() {
            alert("❌ خطأ قاتل: تم تسريع نشر الفضائح على انستغرام وتيكتوك! 😂💀");
        }
    </script>
</body>
</html>
